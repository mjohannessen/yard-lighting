# Installed as /etc/mosquitto/conf.d/lan.conf on the garden Pi (192.168.1.120).
# Mosquitto 2.x listens on localhost only unless a listener is configured;
# openHAB on the Mac Mini (192.168.1.220) needs to reach this broker.
# LAN-only like the Mac Mini's broker (no port forward; SECURITY.md).
listener 1883
allow_anonymous true
